---
# ==============================================================================
# AAP Non-User Credential Management
# ------------------------------------------------------------------------------
# Uses official roles from infra.aap_configuration where available:
#   - hub_collection_remote
#   - hub_ee_registry
#   - controller_settings
# Offline-token keep-alive is custom (no official role).
#
# When run from AAP: attach a credential of type "AAP Token Management".
# When run from CLI: use group_vars/all/vault.yml (ansible-vault).
# ==============================================================================

- name: Manage AAP non-user Red Hat tokens
  hosts: localhost
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Load vault file when present (CLI runs)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
      when: not (aap_hostname is defined and aap_hostname | length > 0)
      ignore_errors: true
      no_log: true

  roles:
    - role: aap_token_mgt
