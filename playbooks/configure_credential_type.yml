---
# Create the "AAP Token Management" custom credential type in Controller.
# Requires admin access. Run once, or include in your broader CaC pipeline.
#
# Usage:
#   ansible-playbook playbooks/configure_credential_type.yml \
#     -e aap_hostname=https://aap.example.com \
#     -e aap_username=admin \
#     -e aap_password=secret \
#     -e aap_validate_certs=false

- name: Configure AAP Token Management credential type
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../configs/credential_types.yml"

  roles:
    - role: infra.aap_configuration.controller_credential_types
