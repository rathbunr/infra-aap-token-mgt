---
# Custom Credential Type for running infra-aap-token-mgt from AAP
# Apply with:
#   ansible-playbook playbooks/configure_credential_type.yml --ask-vault-pass
# Or fold into your existing CaC (controller_credential_types).

controller_credential_types:
  - name: AAP Token Management
    description: >
      Non-user Red Hat tokens for Private Automation Hub remotes,
      registry.redhat.io, and Automation Analytics. Used by the
      infra-aap-token-mgt playbook when run as a Job Template.
    kind: cloud
    inputs:
      fields:
        - id: aap_hostname
          type: string
          label: AAP Hostname
          help_text: Platform Gateway or Controller URL (e.g. https://aap.example.com)
        - id: aap_username
          type: string
          label: AAP Username
        - id: aap_password
          type: string
          label: AAP Password
          secret: true
        - id: aap_validate_certs
          type: boolean
          label: Verify SSL
          default: true
        - id: rh_offline_token
          type: string
          label: Red Hat Offline Token
          help_text: From https://console.redhat.com/ansible/automation-hub/token
          secret: true
        - id: rh_registry_username
          type: string
          label: Registry Service Account Username
          help_text: From https://access.redhat.com/terms-based-registry (e.g. 12345678|myaccount)
        - id: rh_registry_token
          type: string
          label: Registry Service Account Token
          secret: true
        - id: rh_analytics_client_id
          type: string
          label: Analytics Client ID
          help_text: From https://console.redhat.com/iam/service-accounts
        - id: rh_analytics_client_secret
          type: string
          label: Analytics Client Secret
          secret: true
      required:
        - aap_hostname
        - aap_username
        - aap_password
        - rh_offline_token
        - rh_registry_username
        - rh_registry_token
        - rh_analytics_client_id
        - rh_analytics_client_secret
    injectors:
      extra_vars:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: "{{ aap_validate_certs }}"
        rh_offline_token: "{{ rh_offline_token }}"
        rh_registry_username: "{{ rh_registry_username }}"
        rh_registry_token: "{{ rh_registry_token }}"
        rh_analytics_client_id: "{{ rh_analytics_client_id }}"
        rh_analytics_client_secret: "{{ rh_analytics_client_secret }}"
